ki<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GogBot - Georges Lab Assistant</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Page background (remove this section if embedding in your site) ── */
body {
  background: #0f0f0f;
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
}

/* ════════════════════════════════
   FLOATING BUTTON
════════════════════════════════ */
#gogbot-btn {
  position: fixed !important;
  bottom: 24px !important;
  right: 24px !important;
  width: 60px !important;
  height: 60px !important;
  border-radius: 50% !important;
  background: linear-gradient(135deg, #f5a623, #e8403a) !important;
  border: none !important;
  cursor: pointer !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-shadow: 0 4px 20px rgba(245,166,35,0.55) !important;
  z-index: 2147483647 !important;
  animation: gogfloat 3s ease-in-out infinite !important;
  outline: none !important;
}
#gogbot-btn:hover { opacity: 0.92; }

@keyframes gogfloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}

#gogbot-badge {
  position: absolute;
  top: -2px; right: -2px;
  width: 18px; height: 18px;
  background: #ff3b30;
  border-radius: 50%;
  border: 2px solid #0f0f0f;
  font-size: 10px; color: #fff;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ════════════════════════════════
   CHAT WINDOW
════════════════════════════════ */
#gogbot-box {
  position: fixed !important;
  bottom: 96px !important;
  right: 24px !important;
  width: 350px !important;
  height: 540px !important;
  background: #1a1a1a !important;
  border-radius: 20px !important;
  border: 1px solid #2e2e2e !important;
  box-shadow: 0 20px 60px rgba(0,0,0,0.75) !important;
  display: none !important;
  flex-direction: column !important;
  overflow: hidden !important;
  z-index: 2147483646 !important;
  font-family: 'Segoe UI', Arial, sans-serif !important;
}
#gogbot-box.gog-open {
  display: flex !important;
}

/* Header */
#gogbot-head {
  background: linear-gradient(135deg, #f5a623, #e8403a);
  padding: 13px 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
#gogbot-head-av {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.45);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
#gogbot-head-info { flex: 1; }
#gogbot-head-name {
  font-size: 14px; font-weight: 700;
  color: #fff; letter-spacing: 0.2px;
}
#gogbot-head-status {
  font-size: 11px; color: rgba(255,255,255,0.8);
  display: flex; align-items: center; gap: 4px;
  margin-top: 2px;
}
#gogbot-head-dot {
  width: 6px; height: 6px;
  border-radius: 50%; background: #7fff7f;
  animation: gogpulse 2s infinite;
}
@keyframes gogpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
#gogbot-close {
  background: rgba(255,255,255,0.18);
  border: none; border-radius: 50%;
  width: 28px; height: 28px;
  color: #fff; font-size: 16px;
  cursor: pointer; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}

/* Chips */
#gogbot-chips {
  padding: 9px 11px 7px;
  display: flex; flex-wrap: wrap; gap: 5px;
  background: #1a1a1a;
  border-bottom: 1px solid #282828;
  flex-shrink: 0;
}
.gog-chip {
  border: 1px solid rgba(245,166,35,0.6);
  border-radius: 12px;
  padding: 3px 10px;
  font-size: 11px; color: #f5a623;
  background: rgba(245,166,35,0.07);
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
  white-space: nowrap;
}
.gog-chip:hover { background: rgba(245,166,35,0.18); }

/* Messages */
#gogbot-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 12px 11px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: #1a1a1a;
}
#gogbot-msgs::-webkit-scrollbar { width: 3px; }
#gogbot-msgs::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.gog-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  animation: gogmsgin 0.22s ease forwards;
  opacity: 0;
}
@keyframes gogmsgin {
  from { opacity:0; transform:translateY(7px); }
  to   { opacity:1; transform:translateY(0); }
}
.gog-row.user { flex-direction: row-reverse; }

.gog-av {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg,#f5a623,#e8403a);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0;
}
.gog-row.user .gog-av { display: none; }

.gog-bub {
  max-width: 80%;
  padding: 9px 12px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.55;
  word-break: break-word;
}
.gog-row.bot .gog-bub {
  background: #262626;
  color: #ddd;
  border-bottom-left-radius: 4px;
  border: 1px solid #323232;
}
.gog-row.user .gog-bub {
  background: linear-gradient(135deg,#f5a623,#e8403a);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.gog-bub .gog-ts {
  font-size: 9px; opacity: 0.4;
  text-align: right; margin-top: 3px;
}
.gog-bub strong { color: #f5a623; font-weight: 700; }
.gog-row.user .gog-bub strong { color: #fff; }
.gog-bub ul { padding-left: 14px; margin: 4px 0; }
.gog-bub li { margin: 2px 0; }
.gog-bub pre {
  background: rgba(0,0,0,0.4); border-radius: 7px;
  padding: 8px; margin: 6px 0 2px; overflow-x: auto;
  font-family: monospace; font-size: 11px;
  color: #f5a623; line-height: 1.45;
}
.gog-bub code {
  font-family: monospace; font-size: 11px;
  background: rgba(245,166,35,0.13);
  color: #f5a623; padding: 1px 4px; border-radius: 3px;
}
.gog-cta {
  display: inline-block; margin-top: 7px;
  background: linear-gradient(135deg,#f5a623,#e8403a);
  color: #fff !important; text-decoration: none !important;
  padding: 6px 13px; border-radius: 18px;
  font-size: 12px; font-weight: 700;
}

/* Typing */
.gog-typing {
  display: flex; gap: 4px; align-items: center;
  padding: 10px 13px;
}
.gog-typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #555; animation: gogdot 1.2s infinite;
}
.gog-typing span:nth-child(2){animation-delay:.2s}
.gog-typing span:nth-child(3){animation-delay:.4s}
@keyframes gogdot {
  0%,60%,100%{transform:translateY(0);background:#555}
  30%{transform:translateY(-5px);background:#f5a623}
}

/* Quick replies */
.gog-qrs {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 2px 0 3px 32px;
}
.gog-qr {
  border: 1px solid #383838; border-radius: 12px;
  padding: 3px 9px; font-size: 11px; color: #999;
  background: #222; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.gog-qr:hover { border-color:#f5a623; color:#f5a623; background:rgba(245,166,35,0.07); }

/* Lead form */
.gog-lead {
  background: #212121; border: 1px solid #303030;
  border-radius: 12px; padding: 11px 13px; margin-top: 7px;
}
.gog-lead p { font-size: 11px; color: #999; margin-bottom: 7px; }
.gog-lead input {
  width: 100%; background: #2a2a2a; border: 1px solid #383838;
  border-radius: 7px; padding: 7px 9px; color: #ddd;
  font-size: 12px; font-family: inherit; outline: none;
  margin-bottom: 5px;
}
.gog-lead input:focus { border-color: #f5a623; }
.gog-lead input::placeholder { color: #555; }
.gog-lead button {
  width: 100%; background: linear-gradient(135deg,#f5a623,#e8403a);
  border: none; border-radius: 7px; padding: 8px;
  color: #fff; font-weight: 700; font-size: 12px;
  font-family: inherit; cursor: pointer;
}

/* Input bar */
#gogbot-bar {
  padding: 9px 11px;
  background: #1a1a1a;
  border-top: 1px solid #282828;
  display: flex; gap: 7px; align-items: flex-end;
  flex-shrink: 0;
}
#gogbot-wrap {
  flex: 1; background: #252525;
  border: 1px solid #333; border-radius: 18px;
  display: flex; align-items: flex-end;
  padding: 6px 11px; gap: 5px;
  transition: border-color 0.18s;
}
#gogbot-wrap:focus-within { border-color: #f5a623; }
#gogbot-input {
  flex: 1; background: none; border: none; outline: none;
  color: #ddd; font-size: 13px; font-family: inherit;
  resize: none; max-height: 75px; line-height: 1.4;
}
#gogbot-input::placeholder { color: #555; }
#gogbot-send {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; background: linear-gradient(135deg,#f5a623,#e8403a);
  color: #fff; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(245,166,35,0.35);
  transition: transform 0.13s;
}
#gogbot-send:hover  { transform: scale(1.1); }
#gogbot-send:active { transform: scale(0.92); }

#gogbot-foot {
  text-align: center; font-size: 10px; color: #383838;
  padding: 4px 0 7px; background: #1a1a1a; flex-shrink: 0;
}
#gogbot-foot a { color: #f5a623; text-decoration: none; }

@media(max-width:400px){
  #gogbot-box { width:calc(100vw - 18px); right:9px; }
  #gogbot-btn { right:14px; bottom:14px; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════
     GOGBOT WIDGET
     Copy from here to end of file and
     paste before </body> in index.html
     ═══════════════════════════════════ -->

<!-- Floating button -->
<button id="gogbot-btn" onclick="gogToggle()">
  <div id="gogbot-badge">1</div>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"
      stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<!-- Chat window -->
<div id="gogbot-box">
  <!-- Header -->
  <div id="gogbot-head">
    <div id="gogbot-head-av">🤖</div>
    <div id="gogbot-head-info">
      <div id="gogbot-head-name">GogBot · George's Assistant</div>
      <div id="gogbot-head-status">
        <div id="gogbot-head-dot"></div>Online · Instant replies
      </div>
    </div>
    <button id="gogbot-close" onclick="gogToggle()">✕</button>
  </div>

  <!-- Topic chips -->
  <div id="gogbot-chips">
    <button class="gog-chip" onclick="gogChip('What services does George offer?')">Services</button>
    <button class="gog-chip" onclick="gogChip('How much does a website cost?')">Pricing 💰</button>
    <button class="gog-chip" onclick="gogChip('Tell me about the POS system')">POS 🛒</button>
    <button class="gog-chip" onclick="gogChip('How does M-Pesa integration work?')">M-Pesa 💳</button>
    <button class="gog-chip" onclick="gogChip('I want to hire George')">Hire George 🚀</button>
  </div>

  <!-- Messages -->
  <div id="gogbot-msgs"></div>

  <!-- Input -->
  <div id="gogbot-bar">
    <div id="gogbot-wrap">
      <textarea id="gogbot-input" rows="1" placeholder="Ask me anything…"></textarea>
    </div>
    <button id="gogbot-send" onclick="gogSend()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"
          stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="gogbot-foot">
    Powered by <a href="https://georges-lab.github.io/" target="_blank">Georges Lab</a>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG — only change GB_KEY
═══════════════════════════════════════════ */
const GB_KEY  = "AIzaSyAePA1oTbJ-k7NVFayoklI1Yq_Pf-0kTlA"
const GB_URL  = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + GB_KEY;
const GB_URL2 = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=" + GB_KEY;

const GB_PROMPT = `You are GogBot, the AI assistant on George Ndung'u's portfolio website (georges-lab.github.io).
George is a skilled Kenyan web developer and IT technician in Nairobi, Kenya.

SERVICES: Web design/development (HTML CSS JS PHP WordPress), POS software with M-Pesa, M-Pesa Daraja API integration (STK Push C2B B2C), web scraping (Python), task automation, chatbot creation, computer/IT repair.

PROJECTS: delightinternational.co.ke, scotchandgin.delivery, custom POS system (demo on site), M-Pesa integration, automation scripts, weather app.

CONTACT: WhatsApp +254710823964 | Email ndungugeorge065@gmail.com
PRICING: Custom per project — always send to WhatsApp for free quote.

Rules: Be friendly and professional. Use **bold** for key terms. Keep replies short and helpful.`;

const GB_QRS = {
  default : ["What services do you offer?", "How do I contact George?", "See completed projects"],
  pricing : ["Get a free WhatsApp quote",   "What affects the price?",  "What is included?"],
  pos     : ["Does it work offline?",        "Can it use M-Pesa?",       "How much does it cost?"],
  mpesa   : ["How long does it take?",       "What does it cost?",       "Get started 🚀"],
  hire    : ["Chat on WhatsApp 💬",          "Send an email 📧",         "Tell me about services"],
  web     : ["Do you do eCommerce?",         "How long does it take?",   "Can you redesign my site?"],
};

let gogHistory = [];
let gogBusy    = false;
let gogOpen    = false;
let gogLeadDone= false;
let gogCount   = 0;

/* ── Toggle ── */
function gogToggle() {
  gogOpen = !gogOpen;
  const box   = document.getElementById('gogbot-box');
  const badge = document.getElementById('gogbot-badge');
  if (gogOpen) {
    box.classList.add('gog-open');
    if (badge) badge.remove();
    if (document.getElementById('gogbot-msgs').children.length === 0) {
      setTimeout(() => gogAddMsg(
        `👋 Hi! I'm **GogBot**, George's AI assistant.\n\nI can help with:\n- 🌐 Web design & development\n- 🛒 POS software\n- 💳 M-Pesa integration\n- 🤖 Automation & scraping\n\nWhat are you looking to build?`,
        'bot', 'hire'), 350);
    }
  } else {
    box.classList.remove('gog-open');
  }
}

/* ── Chip ── */
function gogChip(text) {
  document.getElementById('gogbot-input').value = text;
  document.getElementById('gogbot-chips').style.display = 'none';
  gogSend();
}

/* ── Helpers ── */
function gogNow() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function gogEsc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function gogFmt(t) {
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${gogEsc(c.trim())}</code></pre>`);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/^[-•*]\s+(.+)/gm, '<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  t = t.replace(/\n/g, '<br>');
  return t;
}
function gogIntent(text) {
  const t = text.toLowerCase();
  if (/price|cost|how much|rate|quote|budget|fee/.test(t))                 return 'pricing';
  if (/pos|point.of.sale|inventory|receipt|cashier|retail|shop/.test(t))   return 'pos';
  if (/mpesa|m-pesa|safaricom|daraja|stk|lipa|payment/.test(t))            return 'mpesa';
  if (/hire|contact|whatsapp|email|work with|get started|project/.test(t)) return 'hire';
  if (/web|website|wordpress|ecommerce|landing|redesign/.test(t))          return 'web';
  return 'default';
}

/* ── Add message ── */
function gogAddMsg(content, role, intentOverride) {
  const area = document.getElementById('gogbot-msgs');
  area.querySelectorAll('.gog-qrs').forEach(e => e.remove());

  const row = document.createElement('div');
  row.className = 'gog-row ' + role;

  if (role === 'bot') {
    const av = document.createElement('div');
    av.className = 'gog-av'; av.textContent = '🤖';
    row.appendChild(av);
  }

  const bub = document.createElement('div');
  bub.className = 'gog-bub';
  const intent = intentOverride || gogIntent(content);
  let cta = '';
  if (role === 'bot' && (intent === 'hire' || intent === 'pricing') && gogCount > 1) {
    cta = '<br><a class="gog-cta" href="https://wa.me/254710823964?text=Hello%20George,%20I\'m%20interested%20in%20your%20services." target="_blank">💬 Chat on WhatsApp</a>';
  }
  bub.innerHTML = gogFmt(content) + cta + '<div class="gog-ts">' + gogNow() + '</div>';
  row.appendChild(bub);
  area.appendChild(row);

  if (role === 'bot') {
    const qrs   = GB_QRS[intent] || GB_QRS.default;
    const qrDiv = document.createElement('div');
    qrDiv.className = 'gog-qrs';
    qrs.forEach(q => {
      const b = document.createElement('button');
      b.className = 'gog-qr'; b.textContent = q;
      b.onclick = () => { document.getElementById('gogbot-input').value = q; gogSend(); };
      qrDiv.appendChild(b);
    });
    area.appendChild(qrDiv);
    gogCount++;
    if (gogCount === 3 && !gogLeadDone) setTimeout(gogLeadForm, 700);
  }
  area.scrollTop = area.scrollHeight;
}

/* ── Lead form ── */
function gogLeadForm() {
  const area = document.getElementById('gogbot-msgs');
  area.querySelectorAll('.gog-qrs').forEach(e => e.remove());
  const row = document.createElement('div');
  row.className = 'gog-row bot';
  const av = document.createElement('div');
  av.className = 'gog-av'; av.textContent = '🤖';
  const bub = document.createElement('div');
  bub.className = 'gog-bub';
  bub.innerHTML = `
    Interested? Leave your details and George will reach out 👇
    <div class="gog-lead" style="margin-top:9px;">
      <p>Get a free callback from George</p>
      <input id="gog-name"    type="text" placeholder="Your name"/>
      <input id="gog-contact" type="text" placeholder="Phone or email"/>
      <button onclick="gogSubmit()">Send to George 🚀</button>
    </div>
    <div class="gog-ts">${gogNow()}</div>`;
  row.appendChild(av); row.appendChild(bub);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function gogSubmit() {
  const name    = (document.getElementById('gog-name')?.value    || '').trim();
  const contact = (document.getElementById('gog-contact')?.value || '').trim();
  if (!name || !contact) { alert('Please fill in both fields.'); return; }
  gogLeadDone = true;
  const msg = encodeURIComponent(`Hello George! I'm ${name}. Found you via your website chatbot. Contact: ${contact}. I'm interested in your services.`);
  window.open('https://wa.me/254710823964?text=' + msg, '_blank');
  document.querySelectorAll('.gog-lead').forEach(el => el.closest('.gog-row')?.remove());
  gogAddMsg(`✅ Thanks **${name}**! WhatsApp opened with your details. George will be in touch! 😊`, 'bot');
}

/* ── Typing ── */
function gogShowTyping() {
  const area = document.getElementById('gogbot-msgs');
  const row  = document.createElement('div');
  row.id = 'gog-typing'; row.className = 'gog-row bot';
  const av = document.createElement('div');
  av.className = 'gog-av'; av.textContent = '🤖';
  const bub = document.createElement('div');
  bub.className = 'gog-bub';
  bub.innerHTML = '<div class="gog-typing"><span></span><span></span><span></span></div>';
  row.appendChild(av); row.appendChild(bub);
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}
function gogRemoveTyping() { document.getElementById('gog-typing')?.remove(); }

/* ── Send ── */
async function gogSend() {
  if (gogBusy) return;
  const input = document.getElementById('gogbot-input');
  const text  = input.value.trim();
  if (!text) return;

  document.getElementById('gogbot-chips').style.display = 'none';
  input.value = ''; input.style.height = 'auto';
  gogAddMsg(text, 'user');
  gogHistory.push({ role: 'user', parts: [{ text }] });
  gogBusy = true;
  gogShowTyping();

  const body = JSON.stringify({
    system_instruction: { parts: [{ text: GB_PROMPT }] },
    contents          : gogHistory,
    generationConfig  : { maxOutputTokens: 500, temperature: 0.7 }
  });

  let data = null;

  /* Try primary model */
  try {
    const res = await fetch(GB_URL, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    });
    data = await res.json();
    /* If 404 try fallback */
    if (data?.error?.code === 404) {
      const res2 = await fetch(GB_URL2, {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body
      });
      data = await res2.json();
    }
  } catch(e) {
    gogRemoveTyping();
    gogAddMsg(`⚠️ Network error. Check your internet or reach George:\n**WhatsApp:** +254710823964`, 'bot', 'hire');
    gogBusy = false;
    return;
  }

  gogRemoveTyping();

  if (data?.error) {
    const c = data.error.code;
    let msg = `⚠️ Error ${c}: ${data.error.message}`;
    if (c === 400) msg = '⚠️ Invalid API key. Please update gogbot.js with your correct key from aistudio.google.com';
    if (c === 403) msg = '⚠️ API key has no permission. Check aistudio.google.com';
    if (c === 429) msg = '⚠️ Too many requests. Wait a minute and try again.';
    gogAddMsg(msg + '\n\n**WhatsApp:** +254710823964', 'bot', 'hire');
    gogBusy = false;
    return;
  }

  const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, couldn't get a response. Please try again!";
  gogHistory.push({ role: 'model', parts: [{ text: reply }] });
  gogAddMsg(reply, 'bot', gogIntent(text));
  gogBusy = false;
}

/* ── Textarea events ── */
window.addEventListener('load', function() {
  const ta = document.getElementById('gogbot-input');
  ta.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 75) + 'px';
  });
  ta.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); gogSend(); }
  });
});
</script>
