<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GogBot Test v2</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
  h2 { color: #f5a623; margin-bottom: 4px; }
  p  { font-size: 12px; color: #888; margin-bottom: 16px; }
  .card {
    background: #1e1e1e; border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
    border: 1px solid #333;
  }
  input[type=text] {
    width: 100%; background: #2a2a2a; border: 1px solid #444;
    border-radius: 8px; color: #eee; padding: 10px;
    font-size: 13px; box-sizing: border-box; margin-top: 8px;
  }
  button {
    background: linear-gradient(135deg,#f5a623,#e8403a);
    border: none; border-radius: 8px; padding: 12px 20px;
    color: #fff; font-weight: 700; font-size: 14px;
    cursor: pointer; margin-top: 10px; width: 100%;
  }
  #log {
    background: #0a0a0a; border-radius: 8px; padding: 12px;
    font-family: monospace; font-size: 12px;
    min-height: 60px; max-height: 320px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
    border: 1px solid #2a2a2a; margin-top: 8px;
  }
  .ok   { color: #4caf50; }
  .fail { color: #f44336; }
  .info { color: #29b6f6; }
  .warn { color: #ff9800; }
  #advice {
    font-size: 13px; line-height: 1.8;
    margin-top: 8px; display: none;
  }
  code {
    background: #1a1a1a; padding: 2px 6px;
    border-radius: 4px; font-size: 11px;
    word-break: break-all; color: #f5a623;
  }
</style>
</head>
<body>

<h2>🤖 GogBot Test v2</h2>
<p>Automatically finds the correct Gemini model for your API key.</p>

<div class="card">
  <b style="color:#f5a623;">Your Gemini API Key</b>
  <input id="apiKey" type="text" placeholder="Paste key here — no quotes, no semicolon"/>
</div>

<div class="card">
  <b style="color:#f5a623;">Run Test</b><br>
  <small style="color:#888;">This will try every available Gemini model until one works.</small>
  <button onclick="runTest()">🚀 Find Working Model & Test</button>
</div>

<div class="card">
  <b style="color:#f5a623;">Results</b>
  <div id="log">Waiting...</div>
</div>

<div class="card" id="adviceCard" style="display:none;">
  <b style="color:#f5a623;">✅ What To Do Next</b>
  <div id="advice"></div>
</div>

<script>
const log = document.getElementById('log');

function addLog(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = type;
  const icons = { ok:'✅', fail:'❌', info:'ℹ️', warn:'⚠️' };
  line.textContent = `${icons[type] || ''} ${msg}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

/* All known Gemini models to try in order */
const MODELS = [
  'gemini-1.5-flash',
  'gemini-1.5-pro',
  'gemini-pro',
  'gemini-1.0-pro',
  'gemini-2.0-flash-lite',
  'gemini-2.0-flash',
];

async function tryModel(apiKey, model, message) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const res  = await fetch(url, {
    method : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body   : JSON.stringify({
      contents        : [{ role: 'user', parts: [{ text: message }] }],
      generationConfig: { maxOutputTokens: 80 }
    })
  });
  const data = await res.json();
  return { status: res.status, data };
}

async function runTest() {
  log.innerHTML = '';
  document.getElementById('adviceCard').style.display = 'none';

  const apiKey = document.getElementById('apiKey').value.trim();

  /* Validate key */
  if (!apiKey) {
    addLog('Please paste your API key first!', 'fail'); return;
  }
  if (apiKey.includes('"') || apiKey.includes(';')) {
    addLog('Key contains " or ; — please remove them and paste only the raw key', 'fail'); return;
  }
  if (!apiKey.startsWith('AIza')) {
    addLog('Key looks wrong — should start with AIza', 'warn');
  } else {
    addLog('API key format looks correct', 'ok');
  }

  /* Internet check */
  addLog('Checking internet...', 'info');
  try {
    await fetch('https://www.google.com/favicon.ico', { mode:'no-cors', cache:'no-store' });
    addLog('Internet is working', 'ok');
  } catch(e) {
    addLog('No internet connection!', 'fail'); return;
  }

  /* Try each model */
  addLog('Trying Gemini models one by one...', 'info');
  let workingModel = null;
  let workingReply = null;

  for (const model of MODELS) {
    addLog(`Trying: ${model}`, 'info');
    try {
      const { status, data } = await tryModel(apiKey, model, 'Say hello in one sentence.');

      if (status === 200 && !data.error) {
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (reply) {
          addLog(`${model} → WORKS! ✅`, 'ok');
          addLog(`Reply: "${reply.slice(0,80)}"`, 'ok');
          workingModel = model;
          workingReply = reply;
          break;
        }
      } else if (status === 400) {
        addLog(`${model} → Invalid API key (400)`, 'fail');
        break; /* No point trying more if key is wrong */
      } else if (status === 403) {
        addLog(`${model} → No permission (403)`, 'fail');
        break;
      } else if (status === 404) {
        addLog(`${model} → Not found (404), trying next...`, 'warn');
      } else if (status === 429) {
        addLog(`${model} → Rate limited (429), trying next...`, 'warn');
      } else {
        addLog(`${model} → Error ${status}: ${data?.error?.message || 'unknown'}`, 'warn');
      }
    } catch(e) {
      addLog(`${model} → Network error: ${e.message}`, 'warn');
    }
  }

  /* Show result */
  if (workingModel) {
    const adviceCard = document.getElementById('adviceCard');
    const advice     = document.getElementById('advice');
    adviceCard.style.display = 'block';
    advice.innerHTML = `
      <b style="color:#4caf50;">GogBot is working! 🎉</b><br><br>
      The model that works for your key is:<br>
      <code>${workingModel}</code><br><br>
      <b>Now update gogbot.js on GitHub:</b><br>
      1. Open your repo → tap <b>gogbot.js</b> → tap ✏️<br>
      2. Find this line near the top:<br>
      <code>const GB_API_URL = \`...models/gemini-1.5-flash:generateContent...</code><br>
      3. Replace <b>gemini-1.5-flash</b> with <b>${workingModel}</b><br>
      4. Also make sure your key line looks exactly like:<br>
      <code>const GB_API_KEY = "${apiKey}";</code><br>
      5. Commit changes → hard refresh your site<br><br>
      <b style="color:#f5a623;">GogBot will then work perfectly! 🚀</b>
    `;
  } else {
    addLog('No working model found. Your API key may be invalid or restricted.', 'fail');
    document.getElementById('adviceCard').style.display = 'block';
    document.getElementById('advice').innerHTML = `
      Please go to <b>aistudio.google.com</b> and:<br>
      1. Sign in with your Google account<br>
      2. Click <b>Get API Key</b> → <b>Create API key</b><br>
      3. Copy the new key (starts with AIza, no quotes)<br>
      4. Paste it above and run the test again
    `;
  }
}
</script>
</body>
</html>
