<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GogBot Test Page</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
  h2 { color: #f5a623; margin-bottom: 12px; }
  .card {
    background: #1e1e1e; border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
    border: 1px solid #333;
  }
  .status { font-size: 13px; margin: 6px 0; }
  .ok   { color: #4caf50; }
  .fail { color: #f44336; }
  .warn { color: #ff9800; }
  textarea {
    width: 100%; background: #2a2a2a; border: 1px solid #444;
    border-radius: 8px; color: #eee; padding: 10px;
    font-size: 13px; resize: none; margin-top: 8px;
    box-sizing: border-box;
  }
  button {
    background: linear-gradient(135deg,#f5a623,#e8403a);
    border: none; border-radius: 8px; padding: 10px 20px;
    color: #fff; font-weight: 700; font-size: 14px;
    cursor: pointer; margin-top: 8px; width: 100%;
  }
  #log {
    background: #0a0a0a; border-radius: 8px; padding: 12px;
    font-family: monospace; font-size: 12px;
    min-height: 80px; max-height: 300px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
    border: 1px solid #2a2a2a; margin-top: 8px;
  }
  .log-ok   { color: #4caf50; }
  .log-fail { color: #f44336; }
  .log-info { color: #29b6f6; }
  .log-warn { color: #ff9800; }
</style>
</head>
<body>

<h2>🤖 GogBot Diagnostic Tool</h2>
<p style="font-size:12px;color:#888;margin-bottom:16px;">
  This page tests everything and shows results — no developer tools needed.
</p>

<!-- Step 1: API Key Check -->
<div class="card">
  <b style="color:#f5a623;">Step 1 — Enter Your Gemini API Key</b>
  <p class="status warn">Paste your key from aistudio.google.com below:</p>
  <input
    id="apiKeyInput"
    type="text"
    placeholder="AIzaSy..."
    style="width:100%;background:#2a2a2a;border:1px solid #444;border-radius:8px;
           color:#eee;padding:10px;font-size:13px;box-sizing:border-box;margin-top:8px;"
  />
</div>

<!-- Step 2: Test Message -->
<div class="card">
  <b style="color:#f5a623;">Step 2 — Send a Test Message</b>
  <textarea id="testMsg" rows="2" placeholder="Type anything e.g. Hello GogBot!">Hello GogBot!</textarea>
  <button onclick="runTest()">🚀 Run Full Test</button>
</div>

<!-- Step 3: Results -->
<div class="card">
  <b style="color:#f5a623;">Step 3 — Results</b>
  <div id="log">Waiting for test...</div>
</div>

<!-- Step 4: Fix advice -->
<div class="card" id="adviceCard" style="display:none;">
  <b style="color:#f5a623;">Step 4 — What To Do</b>
  <div id="advice" style="font-size:13px;line-height:1.7;margin-top:8px;"></div>
</div>

<script>
const log = document.getElementById('log');

function addLog(msg, type = 'info') {
  const span = document.createElement('span');
  span.className = `log-${type}`;
  const icons = { ok: '✅', fail: '❌', info: 'ℹ️', warn: '⚠️' };
  span.textContent = `${icons[type] || ''} ${msg}\n`;
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

function showAdvice(html) {
  document.getElementById('adviceCard').style.display = 'block';
  document.getElementById('advice').innerHTML = html;
}

async function runTest() {
  log.innerHTML = '';
  document.getElementById('adviceCard').style.display = 'none';

  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const msg    = document.getElementById('testMsg').value.trim() || 'Hello!';

  /* ── Check 1: API key present ── */
  if (!apiKey) {
    addLog('No API key entered!', 'fail');
    showAdvice('Go to <b>aistudio.google.com</b>, create an API key, and paste it above.');
    return;
  }
  if (!apiKey.startsWith('AIza')) {
    addLog('API key looks wrong — should start with AIza', 'warn');
  } else {
    addLog('API key format looks correct', 'ok');
  }

  /* ── Check 2: Internet connectivity ── */
  addLog('Checking internet connection...', 'info');
  try {
    await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
    addLog('Internet connection is working', 'ok');
  } catch(e) {
    addLog('No internet connection detected!', 'fail');
    showAdvice('Please check your internet connection and try again.');
    return;
  }

  /* ── Check 3: Gemini API call ── */
  addLog('Calling Gemini API...', 'info');

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;

  try {
    const res = await fetch(url, {
      method  : 'POST',
      headers : { 'Content-Type': 'application/json' },
      body    : JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: msg }] }],
        generationConfig: { maxOutputTokens: 100 }
      })
    });

    addLog(`API responded with HTTP status: ${res.status}`, res.ok ? 'ok' : 'fail');

    const data = await res.json();

    /* ── Handle errors ── */
    if (data.error) {
      const code = data.error.code;
      const message = data.error.message;
      addLog(`API Error ${code}: ${message}`, 'fail');

      if (code === 400) {
        showAdvice('Your API key is <b>invalid or malformed</b>.<br><br>Go to <b>aistudio.google.com</b> → Get API Key → create a new one and paste it into gogbot.js.');
      } else if (code === 403) {
        showAdvice('API key <b>does not have permission</b>.<br><br>Make sure the key is enabled and you are signed into the correct Google account at aistudio.google.com.');
      } else if (code === 429) {
        showAdvice('You have hit the <b>rate limit</b>. Wait 1 minute and try again. The free tier allows 15 requests per minute.');
      } else {
        showAdvice(`Error: <b>${message}</b><br><br>Try generating a new API key at aistudio.google.com.`);
      }
      return;
    }

    /* ── Success ── */
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (reply) {
      addLog('Gemini replied successfully!', 'ok');
      addLog(`Reply: "${reply.slice(0, 120)}..."`, 'ok');
      showAdvice(`
        <span style="color:#4caf50;font-weight:700;">Everything works! ✅</span><br><br>
        Your API key is valid and Gemini is responding.<br><br>
        <b>Now update gogbot.js on GitHub:</b><br>
        1. Open your repo → tap <b>gogbot.js</b> → tap ✏️<br>
        2. Find this line at the top:<br>
        <code style="background:#1a1a1a;padding:3px 6px;border-radius:4px;">const GB_API_KEY = "YOUR_GEMINI_API_KEY_HERE";</code><br>
        3. Replace <b>YOUR_GEMINI_API_KEY_HERE</b> with:<br>
        <code style="background:#1a1a1a;padding:3px 6px;border-radius:4px;word-break:break-all;">${apiKey}</code><br>
        4. Commit changes and hard-refresh your site.
      `);
    } else {
      addLog('Got a response but no text found — unexpected format', 'warn');
      addLog(JSON.stringify(data).slice(0, 200), 'warn');
      showAdvice('The API responded but in an unexpected format. Check the raw output above and contact George for help.');
    }

  } catch (err) {
    addLog(`Fetch failed: ${err.message}`, 'fail');
    if (err.message.includes('Failed to fetch')) {
      showAdvice('The API call was <b>blocked</b>. This can happen if:<br>- Your internet blocks Google APIs<br>- You are on a restricted network<br><br>Try using mobile data instead of WiFi.');
    } else {
      showAdvice(`Unexpected error: <b>${err.message}</b><br><br>Try refreshing the page and running the test again.`);
    }
  }
}
</script>
</body>
</html>
